# Environment for the Plots.jl -> Makie.jl parity harness.
#
# It deliberately carries *both* backends: `extract_plots_spec.jl` needs Plots/GR to produce the
# golden specs, `plot_gallery.jl` renders the same case matrix in both backends side by side.
# This is a developer environment, not a test dependency — CI only ever reads the committed JSONs.

[deps]
CairoMakie = "13f3f980-e62b-5c42-98c6-ff1f3baf88f0"
JSON = "682c06a0-de6a-54ab-a142-c8b1cf79cde6"
Makie = "ee78f7c6-11fb-53f2-987a-cfe4a2b5a57a"
Plots = "91a5bcdd-55d7-5caf-9e0b-520d859cae80"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
SolidStateDetectors = "71e43887-2bd9-5f77-aebd-47f656f0a3f0"
StaticArrays = "90137ffa-7385-5640-81b9-e52037218182"
StatsBase = "2913bbd2-ae8a-5f71-8c99-4fb6c76f3a91"
Unitful = "1986cc42-f94f-5a68-af5c-568840ba703d"

[sources]
SolidStateDetectors = {path = ".."}

[compat]
CairoMakie = "0.15"
JSON = "1"
Makie = "0.24"
Plots = "1.41"
